<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAPTCHA From Hell</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤯 CAPTCHA FROM HELL</h1>

        <p class="subtitle">
            Prove that you are human.
        </p>

        <div class="captcha-box">

            <h2 id="challenge">
                Click the most disappointed bus.
            </h2>

            <div id="options" class="options">
            </div>

            <button id="verifyButton">
                VERIFY HUMAN
            </button>

            <p id="message"></p>

            <p class="attempt">
                Attempt: <span id="attempt">0</span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
